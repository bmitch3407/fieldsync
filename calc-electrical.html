<!DOCTYPE html>
<html>
<head>
    <title>Electrical Estimate Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #ff9900 0%, #ffaa00 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 40px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #ff9900; }
        .value-display { color: #ff9900; font-weight: 600; margin-top: 8px; text-align: center; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #ff9900 0%, #ffaa00 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 30px; padding: 20px; background: #fff8f0; border-radius: 8px; border-left: 4px solid #ff9900; display: none; }
        .result.show { display: block; }
        .result-price { font-size: 36px; font-weight: 700; color: #ff9900; margin: 10px 0; }
        .result-detail { color: #666; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Electrical Estimate</h1>
        <p class="subtitle">Get an instant price quote</p>

        <div class="form-group">
            <label>Job Type</label>
            <select id="jobtype">
                <option value="repair">Repair/Troubleshooting</option>
                <option value="circuit">New Circuit Installation</option>
                <option value="panel">Panel Upgrade</option>
                <option value="rewire">Full Home Rewire</option>
            </select>
        </div>

        <div class="form-group">
            <label>Square Footage</label>
            <input type="number" id="sqft" value="2000" min="500" max="10000">
        </div>

        <div class="form-group">
            <label>Complexity</label>
            <input type="range" id="complexity" min="1" max="5" value="2">
            <div class="value-display" id="complexityLabel">Standard</div>
        </div>

        <div class="form-group">
            <label>Additional Services</label>
            <select id="accessory">
                <option value="none">None</option>
                <option value="surge">Whole Home Surge Protection (+$600)</option>
                <option value="ev">EV Charger Install (+$1,500)</option>
                <option value="generator">Generator Installation (+$5,000)</option>
                <option value="smart">Smart Home Wiring (+$2,000)</option>
                <option value="solar">Solar Panel Integration (+$3,000)</option>
                <option value="all">Premium Package (+$8,000)</option>
            </select>
        </div>

        <button onclick="calculate()">Calculate Estimate</button>

        <div class="result" id="result">
            <strong>Your Estimated Cost</strong>
            <div class="result-price" id="price">$0</div>
            <div class="result-detail">
                Includes labor, materials, permits, and 2-year warranty<br>
                Timeline: <span id="timeline">2-5 days</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('complexity').addEventListener('input', function() {
            const labels = {1: 'Simple', 2: 'Standard', 3: 'Complex', 4: 'Very Complex', 5: 'Highly Complex'};
            document.getElementById('complexityLabel').textContent = labels[this.value];
        });

        function calculate() {
            const jobtype = document.getElementById('jobtype').value;
            const sqft = parseInt(document.getElementById('sqft').value) || 2000;
            const complexity = parseInt(document.getElementById('complexity').value);
            const accessory = document.getElementById('accessory').value;

            let price = 500;

            const jobtypeMult = {repair: 1, circuit: 1.5, panel: 2.5, rewire: 3.5};
            price *= jobtypeMult[jobtype] || 1;

            price += (sqft / 500) * 300;
            price *= [0, 0.8, 1, 1.2, 1.4, 1.6][complexity];

            const addons = {none: 0, surge: 600, ev: 1500, generator: 5000, smart: 2000, solar: 3000, all: 8000};
            price += addons[accessory] || 0;

            const final = Math.round(price / 100) * 100;

            let timeline = '2-5 days';
            if (complexity >= 4) timeline = '1-2 weeks';
            if (jobtype === 'rewire') timeline = '2-3 weeks';

            document.getElementById('price').textContent = '$' + final.toLocaleString();
            document.getElementById('timeline').textContent = timeline;
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
