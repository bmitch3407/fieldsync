<!DOCTYPE html>
<html>
<head>
    <title>HVAC Estimate Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 40px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .value-display { color: #667eea; font-weight: 600; margin-top: 8px; text-align: center; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 30px; padding: 20px; background: #f8f9ff; border-radius: 8px; border-left: 4px solid #667eea; display: none; }
        .result.show { display: block; }
        .result-price { font-size: 36px; font-weight: 700; color: #667eea; margin: 10px 0; }
        .result-detail { color: #666; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HVAC Estimate</h1>
        <p class="subtitle">Get an instant price quote</p>

        <div class="form-group">
            <label>Square Footage</label>
            <input type="number" id="sqft" value="2000" min="500" max="10000">
        </div>

        <div class="form-group">
            <label>System Type</label>
            <select id="system">
                <option value="basic">Basic AC/Heating</option>
                <option value="high-efficiency">High-Efficiency System</option>
                <option value="heat-pump">Heat Pump System</option>
                <option value="multi-zone">Multi-Zone System</option>
            </select>
        </div>

        <div class="form-group">
            <label>Complexity</label>
            <input type="range" id="complexity" min="1" max="5" value="2">
            <div class="value-display" id="complexityLabel">Standard</div>
        </div>

        <div class="form-group">
            <label>Add-ons</label>
            <select id="accessory">
                <option value="none">None</option>
                <option value="thermostat">Smart Thermostat (+$500)</option>
                <option value="ductwork">Ductwork Upgrade (+$1,200)</option>
                <option value="air-quality">Air Quality System (+$800)</option>
                <option value="uv-light">UV Light & Sanitizer (+$600)</option>
                <option value="humidifier">Humidifier System (+$900)</option>
                <option value="maintenance">1-Year Maintenance Plan (+$400)</option>
                <option value="all">All Add-ons Bundle (+$3,500)</option>
            </select>
        </div>

        <button onclick="calculate()">Calculate Estimate</button>

        <div class="result" id="result">
            <strong>Your Estimated Cost</strong>
            <div class="result-price" id="price">$0</div>
            <div class="result-detail">
                Includes equipment, installation, 1-year warranty<br>
                Timeline: <span id="timeline">1-2 weeks</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('complexity').addEventListener('input', function() {
            const labels = {1: 'Simple', 2: 'Standard', 3: 'Complex', 4: 'Very Complex', 5: 'Highly Complex'};
            document.getElementById('complexityLabel').textContent = labels[this.value];
        });

        function calculate() {
            const sqft = parseInt(document.getElementById('sqft').value) || 2000;
            const system = document.getElementById('system').value;
            const complexity = parseInt(document.getElementById('complexity').value);
            const accessory = document.getElementById('accessory').value;

            let price = sqft * 3;

            const systemMult = {basic: 1, 'high-efficiency': 1.3, 'heat-pump': 1.5, 'multi-zone': 1.8};
            price *= systemMult[system] || 1;

            price *= [0, 0.8, 1, 1.2, 1.4, 1.6][complexity];

            const addons = {none: 0, thermostat: 500, ductwork: 1200, 'air-quality': 800, 'uv-light': 600, humidifier: 900, maintenance: 400, all: 3500};
            price += addons[accessory] || 0;

            const final = Math.round(price / 100) * 100;

            let timeline = '1-2 weeks';
            if (complexity >= 4) timeline = '2-3 weeks';
            if (sqft > 5000) timeline = '2-4 weeks';

            document.getElementById('price').textContent = '$' + final.toLocaleString();
            document.getElementById('timeline').textContent = timeline;
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
