<!DOCTYPE html>
<html>
<head>
    <title>General Contracting Estimate Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #7b68ee 0%, #9370db 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 40px; }
        h1 { color: #333; font-size: 28px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #7b68ee; }
        .value-display { color: #7b68ee; font-weight: 600; margin-top: 8px; text-align: center; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #7b68ee 0%, #9370db 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 30px; padding: 20px; background: #f3e5f5; border-radius: 8px; border-left: 4px solid #7b68ee; display: none; }
        .result.show { display: block; }
        .result-price { font-size: 36px; font-weight: 700; color: #7b68ee; margin: 10px 0; }
        .result-detail { color: #666; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Construction Estimate</h1>
        <p class="subtitle">Get an instant price quote</p>

        <div class="form-group">
            <label>Project Type</label>
            <select id="jobtype">
                <option value="addition">Room Addition</option>
                <option value="remodel">Kitchen/Bath Remodel</option>
                <option value="foundation">Foundation Repair</option>
                <option value="newbuild">New Construction</option>
            </select>
        </div>

        <div class="form-group">
            <label>Project Size (Square Feet)</label>
            <input type="number" id="sqft" value="1000" min="200" max="10000">
        </div>

        <div class="form-group">
            <label>Scope & Complexity</label>
            <input type="range" id="complexity" min="1" max="5" value="2">
            <div class="value-display" id="complexityLabel">Standard</div>
        </div>

        <div class="form-group">
            <label>Materials & Upgrades</label>
            <select id="accessory">
                <option value="standard">Standard Materials</option>
                <option value="premium">Premium Finishes (+$5,000)</option>
                <option value="permits">Permits & Inspections (+$1,500)</option>
                <option value="hvac">HVAC Integration (+$3,000)</option>
                <option value="energy">Energy Efficient Upgrade (+$4,000)</option>
                <option value="structural">Structural Reinforcement (+$2,500)</option>
                <option value="all">Premium Complete (+$10,000)</option>
            </select>
        </div>

        <button onclick="calculate()">Calculate Estimate</button>

        <div class="result" id="result">
            <strong>Your Estimated Cost</strong>
            <div class="result-price" id="price">$0</div>
            <div class="result-detail">
                Includes design, materials, labor, permits, and 1-year warranty<br>
                Timeline: <span id="timeline">4-8 weeks</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('complexity').addEventListener('input', function() {
            const labels = {1: 'Simple', 2: 'Standard', 3: 'Complex', 4: 'Very Complex', 5: 'Highly Complex'};
            document.getElementById('complexityLabel').textContent = labels[this.value];
        });

        function calculate() {
            const jobtype = document.getElementById('jobtype').value;
            const sqft = parseInt(document.getElementById('sqft').value) || 1000;
            const complexity = parseInt(document.getElementById('complexity').value);
            const accessory = document.getElementById('accessory').value;

            let price = sqft * 100;

            const jobtypeMult = {addition: 1.2, remodel: 1.3, foundation: 1.5, newbuild: 1};
            price *= jobtypeMult[jobtype] || 1;

            price *= [0, 0.8, 1, 1.2, 1.4, 1.6][complexity];

            const addons = {standard: 0, premium: 5000, permits: 1500, hvac: 3000, energy: 4000, structural: 2500, all: 10000};
            price += addons[accessory] || 0;

            const final = Math.round(price / 100) * 100;

            let timeline = '4-8 weeks';
            if (complexity >= 4) timeline = '8-12 weeks';
            if (jobtype === 'newbuild') timeline = '12-16 weeks';

            document.getElementById('price').textContent = '$' + final.toLocaleString();
            document.getElementById('timeline').textContent = timeline;
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
